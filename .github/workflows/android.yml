name: Android CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: "Also publish the APK as a GitHub pre-release (a link you can tap on a phone)"
        type: boolean
        default: false
      screenshots:
        description: "Also draw every screen to a picture (see the ci-screens branch)"
        type: boolean
        default: false
      notes_for:
        description: "Only rewrite the What's new text of an existing release (for example build-34) from .github/release-notes.md. Nothing is built."
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || inputs.notes_for == ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      fixed_key: ${{ steps.signing.outputs.fixed_key }}
      cert_sha256: ${{ steps.cert.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      # Builds signed with the same key can be installed over each other. Without these secrets (the README says how
      # to add them) every build gets a new throwaway key and has to be uninstalled first. Forks never see secrets.
      - name: Prepare signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.CARDPULSE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.CARDPULSE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CARDPULSE_KEY_ALIAS }}
        run: bash .github/scripts/prepare-signing.sh

      # The release build: R8 trims the code and resources that aren't used (see app/build.gradle.kts). The unit tests
      # above run against the debug build, which R8 never touches.
      - name: Build the APK
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Report what the APK is made of
        run: python3 .github/scripts/apk-report.py "$(ls app/build/outputs/apk/release/*.apk)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Record which key signed the APK
        id: cert
        env:
          FIXED_KEY: ${{ steps.signing.outputs.fixed_key }}
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk)
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1 || true)
          digest=""
          if [ -n "$apksigner" ]; then
            # The line reads "V2 Signer: certificate SHA-256 digest: ..." (older tools: "Signer #1 certificate ...").
            digest=$("$apksigner" verify --print-certs "$apk" | sed -n 's/^.*certificate SHA-256 digest: //p' | head -1)
          fi
          if [ -z "$digest" ]; then echo "::warning::Could not read the signing certificate from the APK."; fi
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"
          kind="a throwaway debug key"
          if [ "$FIXED_KEY" = "true" ]; then kind="the fixed signing key"; fi
          echo "Signed with ${kind}${digest:+ (certificate SHA-256 $digest)}." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cardpulse-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  # Draws every screen with fake data (src/screenshots) and keeps the pictures on the ci-screens branch, which is
  # rewritten each time, so layout and colour problems can be looked at without a phone. Runs on pushes to claude/*
  # branches or when asked for. It never decides whether the build is good: the APK doesn't wait for it, and a failure
  # here doesn't fail the run.
  screenshots:
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/claude/')) || (github.event_name == 'workflow_dispatch' && inputs.screenshots)
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Draw the screens
        run: ./gradlew --no-daemon :app:testDebugUnitTest -Pscreenshots

      - name: Keep the pictures with the run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screens
          path: app/build/screens
          if-no-files-found: ignore

      - name: Put the pictures on the ci-screens branch
        if: always() && hashFiles('app/build/screens/*.png') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          dir=$(mktemp -d)
          cp app/build/screens/*.png "$dir"/
          cd "$dir"
          git init -q -b ci-screens
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Screens of ${GITHUB_SHA::7} (${GITHUB_REF_NAME})"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-screens

  # Only runs when started by hand with "publish" ticked. Pre-releases are public, so this is opt-in.
  release:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: cardpulse-apk
          path: dist

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          FIXED_KEY: ${{ needs.build.outputs.fixed_key }}
          CERT_SHA256: ${{ needs.build.outputs.cert_sha256 }}
        run: |
          tag="build-${{ github.run_number }}"
          apk="dist/CardPulse-${tag}.apk"
          mv dist/*.apk "$apk"
          # The app ID the build was made with, straight from the Gradle file.
          APP_ID=$(sed -n 's/^[[:space:]]*applicationId = "\(.*\)"$/\1/p' app/build.gradle.kts | head -1)
          if [ -z "$APP_ID" ]; then echo "::error::Could not read the applicationId from app/build.gradle.kts"; exit 1; fi
          {
            echo "CardPulse ${tag} of commit ${GITHUB_SHA::7}. Release build (unused code trimmed), for sideloading."
            echo
            echo "**Install:** download the .apk on your phone and open it. If Android asks, allow \"Install unknown apps\" for your browser or Files app."
            echo
            if [ "$FIXED_KEY" = "true" ]; then
              echo "**Updating:** this build is signed with your fixed key, so it installs straight over an earlier build with the same app ID (\`${APP_ID}\`), keeping your saved address and sign-in. A build with a different app ID installs next to the old app as a separate one instead; What's new says when that happens. A build that was signed with a throwaway key has to be removed first, once."
            else
              echo "**Updating:** uninstall the previous build first. This build is signed with a throwaway key that changes every time, so Android will not update one in place. (The README explains how to set up a fixed key.)"
            fi
            echo
            echo "**First launch:** enter the https:// address of your own PokéCollector server, then your username and password."
            echo
            echo "SHA-256: \`$(sha256sum "$apk" | cut -d' ' -f1)\`"
            if [ -n "$CERT_SHA256" ]; then
              echo
              echo "Signing certificate SHA-256: \`${CERT_SHA256}\` (Android only updates an app in place when this matches the installed one.)"
            fi
          } > notes.md
          # What changed in this build, written by hand in .github/release-notes.md.
          if [ -s .github/release-notes.md ]; then
            python3 .github/scripts/whats_new.py notes.md .github/release-notes.md > notes-with-news.md
            mv notes-with-news.md notes.md
          fi
          gh release create "$tag" "$apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "CardPulse ${tag}" \
            --notes-file notes.md

  # Started by hand with "notes_for" set to a tag: puts the current .github/release-notes.md into that release's
  # page (replacing an earlier What's new section), leaving the install text and checksums alone. Builds nothing.
  notes:
    if: github.event_name == 'workflow_dispatch' && inputs.notes_for != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Update the release page
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.notes_for }}
        run: |
          # Only the builds this workflow publishes, the same rule the clean-up workflow follows.
          if ! [[ "$TAG" =~ ^build-[0-9]+$ ]]; then
            echo "::error::Only build-<number> releases can be edited here, not '$TAG'."
            exit 1
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > current.md
          python3 .github/scripts/whats_new.py current.md .github/release-notes.md > updated.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file updated.md
          echo "Updated the notes of $TAG." | tee -a "$GITHUB_STEP_SUMMARY"
