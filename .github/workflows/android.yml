name: Android CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: "Also publish the debug APK as a GitHub pre-release (a link you can tap on a phone)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cardpulse-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # Only runs when started by hand with "publish" ticked. Pre-releases are public, so this is opt-in.
  release:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cardpulse-debug-apk
          path: dist

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${{ github.run_number }}"
          apk="dist/CardPulse-${tag}.apk"
          mv dist/*.apk "$apk"
          {
            echo "CardPulse debug build ${tag} of commit ${GITHUB_SHA::7}. Debug-signed, for sideloading only."
            echo
            echo "**Install:** download the .apk on your phone and open it. If Android asks, allow \"Install unknown apps\" for your browser or Files app."
            echo
            echo "**Updating:** uninstall the previous build first. Every CI build is signed with a different throwaway key, so Android will not update one in place."
            echo
            echo "**First launch:** enter the https:// address of your own PokéCollector server, then your username and password."
            echo
            echo "SHA-256: \`$(sha256sum "$apk" | cut -d' ' -f1)\`"
          } > notes.md
          gh release create "$tag" "$apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "CardPulse debug build ${tag}" \
            --notes-file notes.md
