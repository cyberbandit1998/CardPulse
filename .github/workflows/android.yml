name: Android CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: "Also publish the debug APK as a GitHub pre-release (a link you can tap on a phone)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      fixed_key: ${{ steps.signing.outputs.fixed_key }}
      cert_sha256: ${{ steps.cert.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Self-test, stand-in for the secrets
        id: fake
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/fake.jks" -storetype PKCS12 -storepass 'self test pw$1' \
            -alias cardpulse -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=CardPulse self-test"
          echo "b64=$(base64 "$RUNNER_TEMP/fake.jks" | tr -d '\n')" >> "$GITHUB_OUTPUT"
          keytool -list -v -keystore "$RUNNER_TEMP/fake.jks" -storepass 'self test pw$1' \
            | sed -n 's/^.*SHA256: //p' | tr -d ':' | tr 'A-F' 'a-f' | head -1 > "$RUNNER_TEMP/expected_sha256.txt"
          echo "expected certificate: $(cat "$RUNNER_TEMP/expected_sha256.txt")"

      # Builds signed with the same key can be installed over each other. Without these secrets (the README says how
      # to add them) every build gets a new throwaway key and has to be uninstalled first. Forks never see secrets.
      - name: Prepare signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ steps.fake.outputs.b64 }}
          KEYSTORE_PASSWORD: 'self test pw$1'
          KEY_ALIAS: cardpulse
        run: bash .github/scripts/prepare-signing.sh

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Record which key signed the APK
        id: cert
        env:
          FIXED_KEY: ${{ steps.signing.outputs.fixed_key }}
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1 || true)
          digest=""
          if [ -n "$apksigner" ]; then
            digest=$("$apksigner" verify --print-certs app/build/outputs/apk/debug/*.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          fi
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"
          kind="a throwaway debug key"
          if [ "$FIXED_KEY" = "true" ]; then kind="the fixed signing key"; fi
          echo "Signed with ${kind}${digest:+ (certificate SHA-256 $digest)}." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Self-test, assert the signing key and the version number
        run: |
          apk=$(ls app/build/outputs/apk/debug/*.apk)
          actual="${{ steps.cert.outputs.sha256 }}"
          expected=$(cat "$RUNNER_TEMP/expected_sha256.txt")
          echo "expected certificate: $expected"
          echo "actual certificate:   $actual"
          test -n "$actual" && test "$actual" = "$expected"
          aapt2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          badging=$("$aapt2" dump badging "$apk" | head -1)
          echo "$badging"
          echo "$badging" | grep -q "versionCode='${{ github.run_number }}'"
          echo "SELF-TEST PASSED: the APK is signed with the stand-in key and versionCode is the run number"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cardpulse-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # Only runs when started by hand with "publish" ticked. Pre-releases are public, so this is opt-in.
  release:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cardpulse-debug-apk
          path: dist

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          FIXED_KEY: ${{ needs.build.outputs.fixed_key }}
          CERT_SHA256: ${{ needs.build.outputs.cert_sha256 }}
        run: |
          tag="build-${{ github.run_number }}"
          apk="dist/CardPulse-${tag}.apk"
          mv dist/*.apk "$apk"
          {
            echo "CardPulse debug build ${tag} of commit ${GITHUB_SHA::7}. Debug build, for sideloading only."
            echo
            echo "**Install:** download the .apk on your phone and open it. If Android asks, allow \"Install unknown apps\" for your browser or Files app."
            echo
            if [ "$FIXED_KEY" = "true" ]; then
              echo "**Updating:** this build is signed with your fixed key, so it installs straight over the previous build with no need to uninstall. The exception is a build that was signed with a throwaway key: remove that one first, once."
            else
              echo "**Updating:** uninstall the previous build first. This build is signed with a throwaway key that changes every time, so Android will not update one in place. (The README explains how to set up a fixed key.)"
            fi
            echo
            echo "**First launch:** enter the https:// address of your own PokéCollector server, then your username and password."
            echo
            echo "SHA-256: \`$(sha256sum "$apk" | cut -d' ' -f1)\`"
            if [ -n "$CERT_SHA256" ]; then
              echo
              echo "Signing certificate SHA-256: \`${CERT_SHA256}\` (Android only updates an app in place when this matches the installed one.)"
            fi
          } > notes.md
          gh release create "$tag" "$apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "CardPulse debug build ${tag}" \
            --notes-file notes.md
