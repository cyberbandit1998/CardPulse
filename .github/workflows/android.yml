name: Android CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: "Also publish the debug APK as a GitHub pre-release (a link you can tap on a phone)"
        type: boolean
        default: false
      screenshots:
        description: "Also draw every screen to a picture (see the ci-screens branch)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      fixed_key: ${{ steps.signing.outputs.fixed_key }}
      cert_sha256: ${{ steps.cert.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      # Builds signed with the same key can be installed over each other. Without these secrets (the README says how
      # to add them) every build gets a new throwaway key and has to be uninstalled first. Forks never see secrets.
      - name: Prepare signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.CARDPULSE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.CARDPULSE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CARDPULSE_KEY_ALIAS }}
        run: bash .github/scripts/prepare-signing.sh

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Record which key signed the APK
        id: cert
        env:
          FIXED_KEY: ${{ steps.signing.outputs.fixed_key }}
        run: |
          apk=$(ls app/build/outputs/apk/debug/*.apk)
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1 || true)
          digest=""
          if [ -n "$apksigner" ]; then
            # The line reads "V2 Signer: certificate SHA-256 digest: ..." (older tools: "Signer #1 certificate ...").
            digest=$("$apksigner" verify --print-certs "$apk" | sed -n 's/^.*certificate SHA-256 digest: //p' | head -1)
          fi
          if [ -z "$digest" ]; then echo "::warning::Could not read the signing certificate from the APK."; fi
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"
          kind="a throwaway debug key"
          if [ "$FIXED_KEY" = "true" ]; then kind="the fixed signing key"; fi
          echo "Signed with ${kind}${digest:+ (certificate SHA-256 $digest)}." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cardpulse-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # Draws every screen with fake data (src/screenshots) and keeps the pictures on the ci-screens branch, which is
  # rewritten each time, so layout and colour problems can be looked at without a phone. Runs on pushes to claude/*
  # branches or when asked for. It never decides whether the build is good: the APK doesn't wait for it, and a failure
  # here doesn't fail the run.
  screenshots:
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/claude/')) || (github.event_name == 'workflow_dispatch' && inputs.screenshots)
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Draw the screens
        run: ./gradlew --no-daemon :app:testDebugUnitTest -Pscreenshots

      - name: Keep the pictures with the run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screens
          path: app/build/screens
          if-no-files-found: ignore

      - name: Put the pictures on the ci-screens branch
        if: always() && hashFiles('app/build/screens/*.png') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          dir=$(mktemp -d)
          cp app/build/screens/*.png "$dir"/
          cd "$dir"
          git init -q -b ci-screens
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Screens of ${GITHUB_SHA::7} (${GITHUB_REF_NAME})"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-screens

  # Only runs when started by hand with "publish" ticked. Pre-releases are public, so this is opt-in.
  release:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cardpulse-debug-apk
          path: dist

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          FIXED_KEY: ${{ needs.build.outputs.fixed_key }}
          CERT_SHA256: ${{ needs.build.outputs.cert_sha256 }}
        run: |
          tag="build-${{ github.run_number }}"
          apk="dist/CardPulse-${tag}.apk"
          mv dist/*.apk "$apk"
          {
            echo "CardPulse debug build ${tag} of commit ${GITHUB_SHA::7}. Debug build, for sideloading only."
            echo
            echo "**Install:** download the .apk on your phone and open it. If Android asks, allow \"Install unknown apps\" for your browser or Files app."
            echo
            if [ "$FIXED_KEY" = "true" ]; then
              echo "**Updating:** this build is signed with your fixed key, so it installs straight over the previous build with no need to uninstall. The exception is a build that was signed with a throwaway key: remove that one first, once."
            else
              echo "**Updating:** uninstall the previous build first. This build is signed with a throwaway key that changes every time, so Android will not update one in place. (The README explains how to set up a fixed key.)"
            fi
            echo
            echo "**First launch:** enter the https:// address of your own PokéCollector server, then your username and password."
            echo
            echo "SHA-256: \`$(sha256sum "$apk" | cut -d' ' -f1)\`"
            if [ -n "$CERT_SHA256" ]; then
              echo
              echo "Signing certificate SHA-256: \`${CERT_SHA256}\` (Android only updates an app in place when this matches the installed one.)"
            fi
          } > notes.md
          gh release create "$tag" "$apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "CardPulse debug build ${tag}" \
            --notes-file notes.md
