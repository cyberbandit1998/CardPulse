# Builds PokéCollector's backend from the updated source (see README.md in this folder) instead of pulling the published image.
# Use it together with your own docker-compose.yml, which everything else comes from:
#
#   docker compose -f docker-compose.yml -f docker-compose.friends.yml up -d --build backend
#
services:
  backend:
    image: pokecollector-backend:friends
    build:
      # The folder made in step 2, with the update applied. Relative to the folder of your docker-compose.yml.
      context: ../pokecollector-src
      dockerfile: backend/Dockerfile
