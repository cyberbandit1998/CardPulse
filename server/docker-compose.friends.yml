# Builds PokéCollector's backend and website from the updated source (see README.md in this folder) instead of pulling the
# published images. It covers both updates in this folder (Friends & trading, and the daily scan limits). Use it together
# with your own docker-compose.yml, which everything else comes from:
#
#   docker compose -f docker-compose.yml -f docker-compose.friends.yml up -d --build backend frontend
#
services:
  backend:
    image: pokecollector-backend:friends
    build:
      # The folder made in step 2, with the updates applied. Relative to the folder of your docker-compose.yml.
      context: ../pokecollector-src
      dockerfile: backend/Dockerfile
    environment:
      # The server's time zone. The daily scan limits start over at its local midnight, and a container is on UTC unless it is
      # told otherwise. This is Michigan's, America/Detroit, unless the .env file next to your docker-compose.yml sets TZ to
      # another zone (README, step 5).
      TZ: ${TZ:-America/Detroit}

  # The website. Its Leaderboard, Compare and Settings pages are changed too, so it is built from the same folder.
  frontend:
    image: pokecollector-frontend:friends
    build:
      context: ../pokecollector-src
      dockerfile: frontend/Dockerfile
